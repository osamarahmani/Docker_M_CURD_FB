<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - CRUD Operations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #3498db;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 5px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }

        .form-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-update {
            background: #28a745;
            color: white;
        }

        .btn-update:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background: #5a6268;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9em;
            margin: 0 5px;
        }

        .users-section h2 {
            color: #032ce1;
            margin: 20px;
            font-size: 1.5em;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .users-table thead {
            color: rgb(187, 3, 3)#2c3e50
        }

        .users-table th,
        .users-table td {
            padding: 15px;
            text-align: left;
        }

        .users-table tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.3s;
        }

        .users-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .users-table td {
            color: #912626;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #058aff;
        }

        .empty-state p {
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .users-table {
                font-size: 0.9em;
            }

            .btn-small {
                padding: 6px 10px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>User Management System</h1>
            <p>Create, Read, Update & Delete Users</p>
        </div>

        <div class="content">
            <div id="message" class="message"></div>

            <!-- Add/Edit User Form -->
            <div class="form-section">
                <h2 id="formTitle">Add New User</h2>
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter user name">
                    </div>
                    <div class="form-group">
                        <label for="stack">Stack</label>
                        <input type="text" id="stack" name="stack" required placeholder="Enter tech stack">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Add User</button>
                    <button type="button" class="btn btn-cancel" id="cancelBtn" style="display: none;">Cancel</button>
                </form>
            </div>

            <!-- Users List -->
            <div class="users-section">
                <h2>All Users</h2>
                <div id="usersContainer">
                    <table class="users-table" id="usersTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Stack</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersBody"></tbody>
                    </table>
                    <div class="empty-state" id="emptyState">
                        <p>No users found. Add your first user above!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let isEditMode = false;

        // DOM Elements
        const userForm = document.getElementById('userForm');
        const nameInput = document.getElementById('name');
        const stackInput = document.getElementById('stack');
        const userIdInput = document.getElementById('userId');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const formTitle = document.getElementById('formTitle');
        const usersBody = document.getElementById('usersBody');
        const usersTable = document.getElementById('usersTable');
        const emptyState = document.getElementById('emptyState');
        const messageDiv = document.getElementById('message');

        // Load users on page load
        document.addEventListener('DOMContentLoaded', loadUsers);

        // Form submit handler
        userForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                name: nameInput.value.trim(),
                stack: stackInput.value.trim()
            };

            if (isEditMode) {
                await updateUser(userIdInput.value, userData);
            } else {
                await createUser(userData);
            }
        });

        // Cancel button handler
        cancelBtn.addEventListener('click', resetForm);

        // Load all users
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                const users = await response.json();
                
                if (users.length === 0) {
                    usersTable.style.display = 'none';
                    emptyState.style.display = 'block';
                } else {
                    usersTable.style.display = 'table';
                    emptyState.style.display = 'none';
                    displayUsers(users);
                }
            } catch (error) {
                showMessage('Failed to load users', 'error');
                console.error('Error:', error);
            }
        }

        // Display users in table
        function displayUsers(users) {
            usersBody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.stack}</td>
                    <td>
                        <button class="btn btn-update btn-small" onclick="editUser(${user.id}, '${user.name}', '${user.stack}')">
                            Edit
                        </button>
                        <button class="btn btn-delete btn-small" onclick="deleteUser(${user.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Create new user
        async function createUser(userData) {
            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });
                
                if (response.ok) {
                    showMessage('User added successfully!', 'success');
                    resetForm();
                    loadUsers();
                } else {
                    showMessage('Failed to add user', 'error');
                }
            } catch (error) {
                showMessage('Error adding user', 'error');
                console.error('Error:', error);
            }
        }

        // Update user
        async function updateUser(id, userData) {
            try {
                const response = await fetch(`${API_URL}/users/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });
                
                if (response.ok) {
                    showMessage('User updated successfully!', 'success');
                    resetForm();
                    loadUsers();
                } else {
                    showMessage('Failed to update user', 'error');
                }
            } catch (error) {
                showMessage('Error updating user', 'error');
                console.error('Error:', error);
            }
        }

        // Delete user
        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showMessage('User deleted successfully!', 'success');
                    loadUsers();
                } else {
                    showMessage('Failed to delete user', 'error');
                }
            } catch (error) {
                showMessage('Error deleting user', 'error');
                console.error('Error:', error);
            }
        }

        // Edit user (populate form)
        function editUser(id, name, stack) {
            isEditMode = true;
            userIdInput.value = id;
            nameInput.value = name;
            stackInput.value = stack;
            formTitle.textContent = 'Update User';
            submitBtn.textContent = 'Update User';
            submitBtn.className = 'btn btn-update';
            cancelBtn.style.display = 'inline-block';
            
            // Scroll to form
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        // Reset form
        function resetForm() {
            isEditMode = false;
            userForm.reset();
            userIdInput.value = '';
            formTitle.textContent = 'Add New User';
            submitBtn.textContent = 'Add User';
            submitBtn.className = 'btn btn-primary';
            cancelBtn.style.display = 'none';
        }

        // Show message
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 3000);
        }
    </script>
</body>
</html>
